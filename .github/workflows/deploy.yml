name: Deploy to Droplet
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30 
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
          echo "Host ${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/config
          echo "  ServerAliveInterval 60" >> ~/.ssh/config
          echo "  ServerAliveCountMax 10" >> ~/.ssh/config
      - name: Deploy over SSH
        run: |
          ssh -o ConnectTimeout=30 -o ConnectionAttempts=10 ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            cd /root/CodeFEGen
            git pull origin main
            docker stop codefegen || true
            docker rm codefegen || true
            COMPOSE_HTTP_TIMEOUT=600 timeout 1800 docker build -t codefegen .
            docker run -d --name codefegen -p 3000:3000 codefegen 
            systemctl restart nginx
          EOF